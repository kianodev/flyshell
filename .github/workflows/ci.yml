name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint & Format (Black & Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Check formatting (Black)
        run: black --check src/ tests/

      - name: Run linter (Flake8)
        run: flake8 --config=.flake8 src/ tests/

  c-format:
    name: C Format (Clang-Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check C formatting
        run: find c_src -type f \( -name "*.c" -o -name "*.h" \) -exec clang-format --dry-run --Werror {} +

  c-lint:
    name: C Lint (Clang-Tidy - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools

      - name: Install clang-tidy (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Generate compile_commands.json from setup.py
        shell: python
        run: |
          import json
          import os
          import pathlib
          import sys
          import sysconfig
          from unittest.mock import patch

          sys.path.insert(0, os.getcwd())

          captured_exts = []
          with patch("setuptools.setup", side_effect=lambda **kw: captured_exts.extend(kw.get("ext_modules", []))):
              import setup

          inc = sysconfig.get_path("include")
          plat = sysconfig.get_path("platinclude")
          cwd = str(pathlib.Path.cwd())
          db = []

          for ext in captured_exts:
              inc_flags = [f"-I{inc}", f"-I{plat}"] + [f"-I{d}" for d in ext.include_dirs]
              macro_flags = [f"-D{k}={v}" if v is not None else f"-D{k}" for k, v in ext.define_macros]
              os_flags = ["-DWIN32", "-D_WIN32"] if sys.platform == "win32" else []

              for src in ext.sources:
                  src_path = str(pathlib.Path(src).resolve())
                  db.append({
                      "directory": cwd,
                      "file": src_path,
                      "arguments": ["clang", *inc_flags, *macro_flags, *os_flags, src_path],
                  })

          pathlib.Path("compile_commands.json").write_text(json.dumps(db, indent=2))

      - name: Run clang-tidy
        shell: python
        run: |
          import json
          import subprocess
          import sys

          entries = json.loads(open("compile_commands.json").read())
          files = [e["file"] for e in entries]
          res = subprocess.run(["clang-tidy", *files])
          sys.exit(res.returncode)

  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Build C extension & install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify native C binary & run Pytest
        run: |
          python -c "import flyshell; assert flyshell.check_native(), 'Native C extension failed to load'"
          pytest