name: Cross-Platform Build & Wheel Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-wheels:
    name: Build Wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build pytest

      - name: Build wheel
        run: python -m build --wheel

      - name: Test local wheel installation
        run: |
          python -m pip install --find-links=dist flyshell
          python -c "import flyshell; print('Flyshell installed successfully')"

      - name: Run pytest
        run: |
          python -m pytest -v