[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flyshell"
dynamic = ["version"]
description = "A modular, zero-dependency command-line environment in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
flyshell = "flyshell.main:main"

[tool.setuptools.dynamic]
version = { attr = "flyshell.__version__" }

[tool.setuptools.packages.find]
where = ["src"]