[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *i686 *musllinux*"
test-command = "python -c \"import flyshell; assert flyshell.check_native()\""

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.linux]
archs = ["auto", "aarch64"]

[project]
name = "flyshell"
dynamic = ["version"]
description = "A modular, zero-dependency command-line environment in Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
flyshell = "flyshell.main:main"

[tool.setuptools.dynamic]
version = { attr = "flyshell.constants.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
    "pytest-cov",
]
readline = [
    "pyreadline3; sys_platform == 'win32'",
]